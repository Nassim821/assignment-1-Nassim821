<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="app-header">
        <div class="header-left">
            <button class="menu-btn" aria-label="Menu">
                <img src="assets/menu_icon.png" alt="">
            </button>
            <div class="search-container">
                <img src="assets/search_icon.png" alt="" class="search-icon">
                <input type="text" placeholder="Quick find" class="search-input">
            </div>
        </div>
        <div class="header-right">
            <span class="counter-badge">
                <img src="assets/check_icon.png" alt="" class="check-icon"> 30/5
            </span>
        </div>
    </header>

    <div class="app-container">
        <nav class="sidebar">
            <ul class="nav-list">
                <li class="nav-item active">
                    <a href="#">
                        <img src="assets/inbox_icon.png" alt="" class="icon">
                        <span>Inbox</span>
                        <span class="badge">5</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#">
                        <img src="assets/calendar_icon.png" alt="" class="icon">
                        <span>Today</span>
                        <span class="badge">5</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#">
                        <img src="assets/upcoming_icon.png" alt="" class="icon">
                        <span>Upcoming</span>
                    </a>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <h1>Inbox</h1>
            
            <ul class="task-list">
                <li class="task-item">
                    <label>
                        <input type="checkbox" name="task">
                        <span>Call Mom</span>
                    </label>
                </li>
                <li class="task-item">
                    <label>
                        <input type="checkbox" name="task">
                        <span>Buy the new issue of Scientific American</span>
                    </label>
                </li>
                <li class="task-item">
                    <label>
                        <input type="checkbox" name="task">
                        <span>Return the textbook to Josie</span>
                    </label>
                </li>
                <li class="task-item">
                    <label>
                        <input type="checkbox" name="task">
                        <span>Buy the new album by Rake</span>
                    </label>
                </li>
                <li class="task-item">
                    <label>
                        <input type="checkbox" name="task">
                        <span>Buy a gift card for Dad</span>
                    </label>
                </li>
            </ul>
        </main>
    </div>

</body>
</html>
